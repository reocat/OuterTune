name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'fastlane/'
      - 'assets/'
      - '.github//*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write
  discussions: write
  actions: write

jobs:
  cleanup:
    # This job runs on a GitHub-hosted runner and can remain as is.
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const cachesToDelete = caches.data.actions_caches
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(5);
              for (const cache of cachesToDelete) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  console.log(`Deleted cache: ${cache.key}`);
                } catch (error) {
                  console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log(`Error in cache cleanup: ${error.message}`);
            }
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: self-hosted
    needs: cleanup

    strategy:
      matrix:
        abi: [ "universal", "arm64", "arm32", "x86" ]

    steps:
      - uses: actions/checkout@v4

      # Change 1: Set environment variables for the job
      - name: Set up Environment Variables
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          # Use the BUILD_TOOLS_VERSION you have installed on your runner
          echo "BUILD_TOOLS_VERSION=33.0.0" >> $GITHUB_ENV
          # Ensure platform-tools are in the PATH
          echo "PATH=$PATH:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Change 2: Removed the "Setup Android SDK" step
      # The action `android-actions/setup-android@v3` is unnecessary on a 
      # self-hosted runner where the SDK is already installed.

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Change 3: Corrected the Gradle build command
      - name: Build APK for ABI
        run: |
          ABI_NAME="${{ matrix.abi }}"
          # Capitalize the ABI name for the Gradle task (e.g., "arm64" -> "Arm64")
          CAPITALIZED_ABI_NAME="$(tr '[:lower:]' '[:upper:]' <<< ${ABI_NAME:0:1})${ABI_NAME:1}"
          ./gradlew assemble${CAPITALIZED_ABI_NAME}Release
        env:
          PULL_REQUEST: 'false'

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk -name "*.apk" -type f | sort
          echo "Directory structure:"
          ls -la app/build/outputs/apk/${{ matrix.abi }}/release/

      - name: Sign APKs
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.abi }}/release
          signingKey: ${{ secrets.RELEASE_KEYSTORE }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: List signed APKs
        run: |
          echo "Signed APKs:"
          find app/build/outputs/apk/${{ matrix.abi }}/release -name "*-signed.apk" -type f | sort

      - name: Organize signed APKs
        run: |
          mkdir -p app/build/outputs/apk/${{ matrix.abi }}/release/out
          signed_apk=$(find app/build/outputs/apk/${{ matrix.abi }}/release -name "*-signed.apk" | head -1)
          if [ -f "$signed_apk" ]; then
            cp "$signed_apk" "app/build/outputs/apk/${{ matrix.abi }}/release/out/app-${{ matrix.abi }}-release.apk"
            echo "Moved signed APK: $signed_apk"
          else
            echo "No signed APK found!"
            exit 1
          fi
          echo "Final APKs in out directory:"
          ls -la app/build/outputs/apk/${{ matrix.abi }}/release/out/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.abi }}-release
          path: "app/build/outputs/apk/${{ matrix.abi }}/release/out/*"
