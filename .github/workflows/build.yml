name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'fastlane/'
      - 'assets/'
      - '.github//*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write
  discussions: write
  actions: write

jobs:
  # This job cleans up old caches to prevent using too much storage.
  # It runs on a standard GitHub-hosted runner.
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow caches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              // Keep the 5 most recent caches, delete the rest
              const cachesToDelete = caches.data.actions_caches
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(5);
              for (const cache of cachesToDelete) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  console.log(`Deleted cache: ${cache.key}`);
                } catch (error) {
                  console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log(`Error in cache cleanup: ${error.message}`);
            }

  # This job builds the APKs on your self-hosted runner.
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: self-hosted
    needs: cleanup

    # This strategy creates a parallel job for each ABI, speeding up the total workflow time.
    strategy:
      matrix:
        abi: [ "universal", "arm64", "arm32", "x86" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Sets the necessary environment variables for the Android SDK on your runner.
      # Ensure the path '$HOME/android-sdk' matches your actual installation location.
      - name: Set up Environment Variables
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

      # Sets up the specified Java version.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # OPTIMIZATION: Enables intelligent caching for Gradle.
      # This action automatically handles saving and restoring dependencies and build outputs.
      # No 'with' block is needed as read/write caching is enabled by default in v4.
      - name: Set Up Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # OPTIMIZATION: Runs the Gradle build.
      # --build-cache: Enables the use of Gradle's local build cache.
      # --no-daemon: Recommended for cleaner, more predictable builds in CI environments.
      - name: Build APK for ABI
        run: |
          ABI_NAME="${{ matrix.abi }}"
          CAPITALIZED_ABI_NAME="$(tr '[:lower:]' '[:upper:]' <<< ${ABI_NAME:0:1})${ABI_NAME:1}"
          ./gradlew assemble${CAPITALIZED_ABI_NAME}Release --build-cache --no-daemon
        env:
          PULL_REQUEST: 'false'

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk -name "*.apk" -type f | sort
          echo "Directory structure:"
          ls -la app/build/outputs/apk/${{ matrix.abi }}/release/

      # Signs the generated release APK.
      - name: Sign APKs
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.abi }}/release
          signingKey: ${{ secrets.RELEASE_KEYSTORE }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: List signed APKs
        run: |
          echo "Signed APKs:"
          find app/build/outputs/apk/${{ matrix.abi }}/release -name "*-signed.apk" -type f | sort
          
      # Organizes the signed APK into a clean 'out' directory with a standardized name.
      - name: Organize signed APKs
        run: |
          mkdir -p app/build/outputs/apk/${{ matrix.abi }}/release/out
          signed_apk=$(find app/build/outputs/apk/${{ matrix.abi }}/release -name "*-signed.apk" | head -1)
          if [ -f "$signed_apk" ]; then
            cp "$signed_apk" "app/build/outputs/apk/${{ matrix.abi }}/release/out/app-${{ matrix.abi }}-release.apk"
            echo "Moved signed APK: $signed_apk"
          else
            echo "No signed APK found!"
            exit 1
          fi
          echo "Final APKs in out directory:"
          ls -la app/build/outputs/apk/${{ matrix.abi }}/release/out/

      # Uploads the final, signed APK as a build artifact.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.abi }}-release
          path: "app/build/outputs/apk/${{ matrix.abi }}/release/out/*"
