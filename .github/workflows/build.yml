name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'fastlane/'
      - 'assets/'
      - '.github//*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write
  discussions: write
  actions: write 

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              const cachesToDelete = caches.data.actions_caches
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(5);

              for (const cache of cachesToDelete) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  console.log(`Deleted cache: ${cache.key}`);
                } catch (error) {
                  console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log(`Error in cache cleanup: ${error.message}`);
            }

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: self-hosted
    needs: cleanup

    strategy:
      matrix:
        abi: [ "universal", "arm64", "arm32", "x86" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK for ABI
        run: ./gradlew assemble${{ matrix.abi }}Release
        env:
          PULL_REQUEST: 'false'

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk -name "*.apk" -type f | sort
          echo "Directory structure:"
          ls -la app/build/outputs/apk/${{ matrix.abi }}/release/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.abi }}-release
          path: "app/build/outputs/apk/${{ matrix.abi }}/release/*"
